<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="17%" style="stop-color:#ff8c00"/>
      <stop offset="33%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#00c853"/>
      <stop offset="67%" style="stop-color:#2196f3"/>
      <stop offset="83%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#276749"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Muscular torso silhouette -->
  <g transform="translate(256,240)" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <ellipse cx="0" cy="-135" rx="32" ry="38" fill="rgba(255,255,255,0.15)" stroke="#fff"/>
    <!-- Neck -->
    <line x1="-12" y1="-97" x2="-18" y2="-75"/>
    <line x1="12" y1="-97" x2="18" y2="-75"/>
    <!-- Shoulders + traps -->
    <path d="M-18,-75 C-30,-78 -75,-85 -105,-60" fill="none"/>
    <path d="M18,-75 C30,-78 75,-85 105,-60" fill="none"/>
    <!-- Arms (flexed/strong pose) -->
    <path d="M-105,-60 C-115,-45 -120,-15 -110,15 C-105,30 -95,35 -85,25" fill="none" stroke-width="10"/>
    <path d="M105,-60 C115,-45 120,-15 110,15 C105,30 95,35 85,25" fill="none" stroke-width="10"/>
    <!-- Chest/pecs -->
    <path d="M-18,-75 C-25,-50 -55,-30 -80,-25" fill="none" stroke-width="6" opacity="0.6"/>
    <path d="M18,-75 C25,-50 55,-30 80,-25" fill="none" stroke-width="6" opacity="0.6"/>
    <!-- Torso sides -->
    <path d="M-85,25 C-75,45 -60,75 -50,100" fill="none"/>
    <path d="M85,25 C75,45 60,75 50,100" fill="none"/>
    <!-- Abs lines -->
    <line x1="0" y1="-40" x2="0" y2="90" stroke-width="4" opacity="0.3"/>
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke-width="3" opacity="0.3"/>
    <line x1="-22" y1="15" x2="22" y2="15" stroke-width="3" opacity="0.3"/>
    <line x1="-20" y1="45" x2="20" y2="45" stroke-width="3" opacity="0.3"/>
  </g>
  <!-- PeitudasNOW text -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="52" fill="url(#rainbow)">PeitudasNOW</text>
</svg>
